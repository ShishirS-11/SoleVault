<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SoleVault Admin — Sign in</title><link rel="icon" href="/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f5f1;color:#111;font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:min(430px,100%)}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#111;margin:0 auto 28px;width:max-content;font-size:14px;letter-spacing:-.04em}.brand span{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#111;color:#fff;font-size:10px;font-weight:900}.brand strong{font-weight:900}.card{background:#fff;border:1px solid #e1e1dc;border-radius:26px;padding:38px;box-shadow:0 25px 80px rgba(0,0,0,.08)}.eyebrow{font-size:9px;font-weight:900;letter-spacing:.16em;color:#777}.card h1{font-size:38px;letter-spacing:-.07em;margin:10px 0 8px}.card p{font-size:11px;line-height:1.6;color:#777;margin:0 0 28px}label{display:grid;gap:8px;font-size:8px;font-weight:900;letter-spacing:.12em;color:#666}input{width:100%;border:1px solid #ddd;border-radius:13px;padding:14px;background:#fafaf8;outline:0;font:inherit;font-size:12px}input:focus{border-color:#111;background:#fff}.submit{width:100%;border:0;border-radius:13px;background:#111;color:#fff;padding:15px;margin-top:18px;font-size:9px;font-weight:900;letter-spacing:.12em;cursor:pointer}.submit:disabled{opacity:.6}.error{min-height:18px;color:#b42318;font-size:10px;margin-top:13px}.back{display:block;text-align:center;margin-top:22px;color:#777;font-size:9px;font-weight:800;text-decoration:none;letter-spacing:.08em}.secure{display:flex;justify-content:center;gap:7px;color:#999;font-size:8px;margin-top:22px}@media(max-width:480px){.card{padding:28px 22px;border-radius:20px}.card h1{font-size:32px}}</style></head><body><main class="wrap"><a class="brand" href="/"><span>SV</span><strong>SOLEVAULT</strong></a><section class="card"><span class="eyebrow">PRIVATE STORE CONTROL</span><h1>Welcome back.</h1><p>Sign in to manage products, inventory, offers and customer orders.</p><form id="login"><label>ADMIN PASSWORD<input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required autofocus></label><div class="error" id="error"></div><button class="submit" id="submit" type="submit">SIGN IN →</button></form></section><div class="secure">● SECURE ADMIN SESSION · 8 HOUR SESSION</div><a class="back" href="/">← BACK TO STORE</a></main><script>const f=document.getElementById('login'),p=document.getElementById('password'),b=document.getElementById('submit'),e=document.getElementById('error');f.addEventListener('submit',async x=>{x.preventDefault();e.textContent='';b.disabled=true;b.textContent='SIGNING IN…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to sign in');location.href='/admin'}catch(err){e.textContent=err.message;p.value='';p.focus()}finally{b.disabled=false;b.textContent='SIGN IN →'}})</script></body></html>
