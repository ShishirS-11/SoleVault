<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoleVault Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><header><a href="/" class="logo">SOLE<span>VAULT</span></a><a href="/">← Store</a></header><main><div class="top"><div><p>ADMIN PANEL</p><h1>Manage the store.</h1></div><button class="primary" id="newBtn">+ ADD SHOE</button></div><section class="stats"><div><span>PRODUCTS</span><b id="productsStat">0</b></div><div><span>LOW STOCK</span><b id="stockStat">0</b></div><div><span>ORDERS</span><b id="ordersStat">0</b></div><div><span>REVENUE</span><b id="revenueStat">₹0</b></div></section><section class="panel"><div class="panelhead"><h2>Products</h2><input id="search" placeholder="Search products..."></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Sizes</th><th>Actions</th></tr></thead><tbody id="productRows"></tbody></table></div></section><section class="panel"><div class="panelhead"><h2>Orders</h2></div><div class="tablewrap"><table><thead><tr><th>#</th><th>Customer</th><th>Total</th><th>Items</th><th>Status</th><th>Date</th></tr></thead><tbody id="orderRows"></tbody></table></div></section></main><div class="modal" id="modal"><form id="form"><button type="button" class="close" id="close">×</button><h2 id="formTitle">Add shoe</h2><input name="name" placeholder="Shoe name" required><select name="category"><option>Sneakers</option><option>Running</option><option>Casual</option><option>Boots</option><option>Sports</option><option>Formal</option></select><div class="tw"><input name="price" type="number" placeholder="Price ₹" required><input name="rating" type="number" min="0" max="5" step=".1" placeholder="Rating"></div><input name="stock" type="number" placeholder="Stock" required><input name="sizes" placeholder="Sizes e.g. 6,7,8,9,10,11,12" value="6,7,8,9,10,11,12"><input name="image" placeholder="Product image URL" required><textarea name="description" placeholder="Description"></textarea><button class="primary">SAVE PRODUCT</button></form></div><div class="toast" id="toast"></div><script src="admin.js"></script></body></html>
